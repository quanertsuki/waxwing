name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-package:
    name: Build npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack npm release
        run: npm pack
      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: waxwing-*.tgz
          if-no-files-found: error

  windows-portable:
    name: Build Windows preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build unsigned portable archive
        run: npm run desktop:portable
      - name: Upload Windows preview
        uses: actions/upload-artifact@v7
        with:
          name: windows-preview
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  npm-publish:
    name: Publish npm package
    needs: npm-package
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish ./waxwing-*.tgz --access public
      - name: Report missing npm token
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; GitHub Release remains the install source."

  github-release:
    name: Publish GitHub release
    needs: [npm-package, windows-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Build combined checksums
        working-directory: release-assets
        shell: bash
        run: |
          rm -f SHA256SUMS
          sha256sum waxwing-*.tgz waxwing-*-windows-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Waxwing ${tag#v}"
          fi
